# Письмо на почту при каждом push: список новых коммитов и ссылка на сравнение.
# Включается после добавления секретов MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO (см. README).
name: Notify on push

on:
  push:
    branches: ["**"]

jobs:
  mail:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Skip when mail secrets are not set
        if: env.MAIL_PASSWORD == '' || env.MAIL_TO == ''
        run: echo "Mail secrets are not configured; nothing to send."

      - name: Build message
        if: env.MAIL_PASSWORD != '' && env.MAIL_TO != ''
        run: |
          python3 - <<'EOF'
          import json, os
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          branch = os.environ["GITHUB_REF_NAME"]
          lines = [f"Репозиторий: {os.environ['GITHUB_REPOSITORY']}", f"Ветка: {branch}",
                   f"Автор push: {event.get('pusher', {}).get('name', '')}", ""]
          for c in event.get("commits", []):
              first = c["message"].splitlines()[0]
              lines.append(f"- {c['id'][:7]} {first}  ({c['author']['name']})")
          lines += ["", f"Изменения: {event.get('compare', '')}"]
          with open("body.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          count = len(event.get("commits", []))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SUBJECT=[{os.environ['GITHUB_REPOSITORY']}] {count} new commit(s) on {branch}\n")
          EOF

      - name: Send mail
        if: env.MAIL_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: ${{ env.SUBJECT }}
          to: ${{ env.MAIL_TO }}
          from: currency-converter-sdd GitHub <${{ env.MAIL_USERNAME }}>
          body: file://body.txt
