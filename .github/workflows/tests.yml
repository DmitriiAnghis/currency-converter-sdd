# Тесты при каждом push и Pull Request: Linux (через виртуальный экран xvfb) и Windows.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - name: Run tests (Linux, virtual display for Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a python -m pytest -v
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v
